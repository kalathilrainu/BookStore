{% extends 'base.html' %}
{% block content %}
<h2>📚 Category List</h2>
<p><a href="{% url 'add_category' %}">➕ Add New Category</a></p>
<hr>

<ul>
  {% for c in cat %}
    <li>
      <a href="{% url 'books_by_category' c.id %}">{{ c.name }}</a>
      — {{ c.description }}
    </li>
  {% empty %}
    <p>No categories yet. <a href="{% url 'add_category' %}">Add one now</a>.</p>
  {% endfor %}
</ul>

{% endblock %}
